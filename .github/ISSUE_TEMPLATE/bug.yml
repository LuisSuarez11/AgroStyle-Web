name: Defecto (Bug)
description: Registrar un defecto encontrado por QA
labels: [bug]
body:
  - type: input
    id: caso
    attributes: { label: Historia y caso de prueba relacionados, placeholder: "ej. CART-02" }
  - type: input
    id: ambiente
    attributes: { label: Ambiente y versión (commit) }
  - type: dropdown
    id: rol
    attributes:
      label: Rol
      options: [Comprador, Productor, Transportista, Administrador]
  - type: textarea
    id: pasos
    attributes: { label: Pasos para reproducir, placeholder: "1. ...\n2. ..." }
  - type: textarea
    id: esperado
    attributes: { label: Resultado esperado vs obtenido }
  - type: textarea
    id: evidencia
    attributes: { label: Evidencia (captura, log, request/response sanitizado) }
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options: [Crítica, Alta, Media, Baja]
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options: [P0, P1, P2, P3]
